<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<link rel="stylesheet" href="/src/content.css">
<script type="module" src="/src/links.js"></script>
</head>
<body>

<h1 style="text-align: center;">Tairusen's Garden</h1>
<div class="metadata"></div>

<div class="home-grid" id="home-grid">

  <div class="recent-box">
    <h3 style="text-align: center;">Recently Updated</h3>
    <ul class="recent-list" id="recent-list"></ul>
  </div>

</div>

<script>
  // The four featured boxes come from draft/home.json, and the "Recently
  // edited" list from the build-time timestamp scan — both injected as
  // window.GARDEN (see vite.config.js).
  const grid = document.getElementById('home-grid');
  for (const card of window.GARDEN.home) {
    const el = document.createElement('div');
    el.className = 'card';
    const title = document.createElement('h3');
    title.textContent = card.title;
    const blurb = document.createElement('p');
    blurb.textContent = card.blurb;
    el.append(title, blurb);
    el.addEventListener('click', () => {
      const hash = '#/' + card.page.replace(/\.html$/, '');
      const top = window.top === window ? window : window.parent;
      top.location.hash = hash;
    });
    grid.appendChild(el);
  }

  const recentList = document.getElementById('recent-list');
  for (const item of window.GARDEN.recent || []) {
    const li = document.createElement('li');
    const link = document.createElement('a');
    link.href = '#/' + item.path.replace(/\.html$/, '');
    link.textContent = item.name;
    const dots = document.createElement('span');
    dots.className = 'dots';
    const date = document.createElement('span');
    date.className = 'date';
    date.textContent = item.time;
    li.append(link, dots, date);
    recentList.appendChild(li);
  }
</script>

</body>
</html>
