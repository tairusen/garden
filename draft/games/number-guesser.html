<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Guesser</title>
<link rel="stylesheet" href="/src/content.css">
<script type="module" src="/src/links.js"></script>
</head>
<body>

<h1>Number Guesser</h1>
<div class="meta">app &middot; plain JS &middot; no dependencies</div>

<p>I'm thinking of a number between 1 and 100. Guess it.</p>

<div class="game-box">
  <input type="number" id="guess-input" min="1" max="100" placeholder="1-100">
  <button id="guess-btn">Guess</button>
  <button id="reset-btn">New Game</button>
  <div class="game-log" id="game-log">New game started. The garden keeps its secrets.</div>
</div>

<script>
  const input = document.getElementById('guess-input');
  const log = document.getElementById('game-log');
  const game = { active: false, target: 0, tries: 0 };

  function resetGame() {
    game.target = 1 + Math.floor(Math.random() * 100);
    game.tries = 0;
    game.active = true;
    input.value = '';
    log.innerHTML = 'New game started. The garden keeps its secrets.';
  }

  function makeGuess() {
    if (!game.active) resetGame();
    const val = parseInt(input.value, 10);
    if (isNaN(val) || val < 1 || val > 100) {
      log.innerHTML += '<div class="miss">&gt; invalid guess (1-100 only)</div>';
      return;
    }
    game.tries++;
    if (val === game.target) {
      log.innerHTML += '<div class="hit">&gt; ' + val + ' &mdash; correct! Solved in ' + game.tries + ' tries.</div>';
      game.active = false;
    } else if (val < game.target) {
      log.innerHTML += '<div class="miss">&gt; ' + val + ' &mdash; too low.</div>';
    } else {
      log.innerHTML += '<div class="miss">&gt; ' + val + ' &mdash; too high.</div>';
    }
    input.value = '';
    input.focus();
  }

  document.getElementById('guess-btn').addEventListener('click', makeGuess);
  document.getElementById('reset-btn').addEventListener('click', resetGame);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') makeGuess();
  });

  resetGame();
</script>

</body>
</html>
