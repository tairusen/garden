<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tairusen's Garden</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪷</text></svg>">
  <script>
    // Apply the saved theme before first paint
    try { var th = localStorage.getItem('garden.theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
  </script>
  <style>
  :root {
    --bg-primary: #1e1e1e;
    --bg-secondary: #252526;
    --bg-tertiary: #2d2d30;
    --bg-input: #333337;
    --border: #3c3c3c;
    --border-dark: #464646;
    --text-primary: #f1f1f1;
    --text-secondary: #a2a4a5;
    --text-disabled: #656565;
    --accent: #0e70c0;
    --selected: #094771;
    --green: #6a9955;
    --heading: #9cdcfe;
    --link: #3794ff;
    --code: #ce9178;
    --miss: #f14c4c;
    --text-body: #d4d4d4;
    --icon-game: #ce9178;
    --icon-game-active: #ffd7c2;
  }

  /* ===== Alternate themes ===== */
  html[data-theme="solarized"] {
    --bg-primary: #002b36;
    --bg-secondary: #073642;
    --bg-tertiary: #0e4a57;
    --bg-input: #0f4a56;
    --border: #1a5663;
    --border-dark: #276570;
    --text-primary: #eee8d5;
    --text-body: #93a1a1;
    --text-secondary: #839496;
    --text-disabled: #586e75;
    --accent: #268bd2;
    --selected: #15495e;
    --green: #859900;
    --heading: #2aa198;
    --link: #268bd2;
    --code: #859900;
    --miss: #dc322f;
    --icon-game: #cb4b16;
    --icon-game-active: #ffb380;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0 !important; }

  html, body {
    height: 100%;
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: Tahoma, "Segoe UI", Geneva, Verdana, sans-serif;
    font-size: 13px;
    overflow: hidden;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    border: 1px solid var(--border-dark);
  }

  /* ===== Title Bar ===== */
  .titlebar {
    display: flex;
    align-items: center;
    background: var(--bg-tertiary);
    border-bottom: 1px solid var(--border-dark);
    height: 28px;
    flex-shrink: 0;
    padding: 0 10px;
    user-select: none;
  }
  .titlebar .app-icon {
    width: 14px; height: 14px;
    margin-right: 8px;
    background: var(--accent);
    border: 1px solid var(--border-dark);
  }
  .titlebar .title { font-size: 12px; }
  .titlebar-btn {
    height: 18px;
    margin-right: 8px;
    background: var(--bg-input);
    border: 1px solid var(--border-dark);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    padding: 8px;
    padding-bottom: 12px;
  }
  .titlebar-btn:hover { border-color: var(--accent); }
  .titlebar-btn:active { background: var(--bg-tertiary); }

  /* ===== Theme dropdown ===== */
  .theme-wrap { position: relative; }
  .theme-menu {
    position: absolute;
    top: 30px;
    left: 0;
    z-index: 40;
    min-width: 170px;
    background: var(--bg-secondary);
    border: 1px solid var(--border-dark);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    display: none;
  }
  .theme-menu.open { display: block; }
  .theme-menu button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    border-bottom: 1px solid var(--border);
    color: var(--text-primary);
    font: 500 12px Tahoma, "Segoe UI", sans-serif;
    letter-spacing: 0.04em;
    padding: 8px 14px;
    cursor: pointer;
  }
  .theme-menu button:last-child { border-bottom: 0; }
  .theme-menu button:hover { background: var(--bg-tertiary); }
  .theme-menu button.active { color: var(--accent); background: var(--bg-input); }

  /* ===== Toolbar / Breadcrumb ===== */
  .toolbar {
    display: flex;
    align-items: center;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    height: 26px;
    padding: 0 8px;
    flex-shrink: 0;
  }
  .breadcrumb { color: var(--text-secondary); font-size: 12px; }
  .breadcrumb .crumb-link { cursor: pointer; }
  .breadcrumb .crumb-link:hover { color: var(--text-primary); text-decoration: underline; }
  .breadcrumb .sep { margin: 0 6px; color: var(--text-disabled); }
  .breadcrumb .crumb-muted { color: var(--text-disabled); }
  .breadcrumb .crumb-current { color: var(--text-primary); }

  /* ===== Main Layout ===== */
  .main { position: relative; display: flex; flex: 1; min-height: 0; }

  /* ===== Side Pane / Explorer — floats over the content pane ===== */
  .sidebar {
    position: absolute;
    left: 10px;
    top: 10px;
    bottom: 10px;
    z-index: 10;
    width: 220px;
    background: var(--bg-secondary);
    border: 1px solid var(--border-dark);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    padding: 4px 0;
    overflow-y: auto;
    user-select: none;
    will-change: transform;
    transition: transform .26s cubic-bezier(.2, .7, .3, 1), opacity .2s ease, visibility 0s linear 0s;
  }
  .app.explorer-hidden .sidebar {
    transform: translateX(calc(-100% - 14px));
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    /* visibility flips only after the slide-out finishes */
    transition: transform .26s cubic-bezier(.2, .7, .3, 1), opacity .2s ease, visibility 0s linear .26s;
  }
  .sidebar-header {
    padding: 4px 10px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border);
    margin: 4px 0 4px 0;
  }

  .tree { font-size: 13px; }
  .tree .row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    line-height: 18px;
    color: var(--text-primary);
    text-decoration: none;
    cursor: pointer;
    border-left: 2px solid transparent;
    white-space: nowrap;
  }
  .tree .row:hover { background: var(--bg-tertiary); }
  .tree .row.active {
    background: var(--selected);
    color: #fff;
    border-left-color: var(--accent);
  }
  .tree .caret,
  .tree .icon {
    width: 13px;
    text-align: center;
    color: var(--text-secondary);
    font-family: monospace;
    flex-shrink: 0;
  }
  .tree .row.active .icon,
  .tree .row.active .caret { color: #fff; }
  .tree .icon.home { color: var(--green); }
  .tree .icon.game { color: var(--icon-game); }
  .tree .row.active .icon.game { color: var(--icon-game-active); }
  .tree .caret::before { content: '▾'; }
  .tree-branch.collapsed > .row .caret::before { content: '▸'; }
  .tree-branch.collapsed > .tree-children { display: none; }
  .tree-children { padding-left: 14px; }
  .tree .folder-label { color: var(--text-primary); }
  .tree-branch.collapsed > .row .folder-label { color: var(--text-secondary); }

  /* ===== Content Pane ===== */
  .content-wrap { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #page-frame {
    flex: 1;
    width: 100%;
    border: 0;
    background: var(--bg-primary);
    min-height: 0;
  }

  /* ===== Scrollbars ===== */
  ::-webkit-scrollbar { width: 14px; height: 14px; }
  ::-webkit-scrollbar-track { background: var(--bg-secondary); }
  ::-webkit-scrollbar-thumb { background: var(--bg-input); border: 1px solid var(--border); }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-dark); }
  ::-webkit-scrollbar-corner { background: var(--bg-secondary); }
</style>
</head>
<body>
<div class="app">

  <!-- Toolbar / Breadcrumb -->
  <div class="toolbar">
    <button class="titlebar-btn" id="explorer-toggle" aria-label="Toggle explorer" title="Toggle explorer (Ctrl+B)">≡</button>
    <div class="theme-wrap">
      <button class="titlebar-btn" id="theme-btn" aria-label="Theme" title="Theme">t</button>
      <div class="theme-menu" id="theme-menu">
        <button data-theme-value="">Dark</button>
        <button data-theme-value="solarized">Solarized Dark</button>
      </div>
    </div>
    <div class="breadcrumb" id="crumb"></div>
  </div>

  <!-- Main -->
  <div class="main">

    <!-- Explorer -->
    <div class="sidebar">
      <div class="sidebar-header">Explorer</div>
      <div class="tree" id="tree"></div>
    </div>

    <!-- Content -->
    <div class="content-wrap">
      <iframe id="page-frame" title="Garden content"></iframe>
    </div>

  </div>
</div>

<script>
  // ===== Data injected at build time (see vite.config.js) =====
  const GARDEN = window.GARDEN;
  const treeEl   = document.getElementById('tree');
  const crumbEl  = document.getElementById('crumb');
  const frame    = document.getElementById('page-frame');

  // Flatten the tree into { path -> title } and keep folder collapse state.
  const titles = {};
  function indexTree(node) {
    for (const item of node.children || []) {
      if (item.type === 'dir') indexTree(item);
      else titles[item.path] = item.title;
    }
  }
  indexTree(GARDEN.tree);
  const knownPaths = new Set(Object.keys(titles));

  const collapsed = new Set(JSON.parse(localStorage.getItem('garden.explorer.collapsed') || '[]'));
  const saveCollapsed = () => localStorage.setItem('garden.explorer.collapsed', JSON.stringify([...collapsed]));

  // ===== Explorer tree =====
  function fileIcon(path, iconOverride) {
    const kind = iconOverride || (path === 'index.html' ? 'home' : path.includes('/games/') || path.startsWith('games/') ? 'game' : 'file');
    if (kind === 'home') return '<span class="icon home">⌂</span>';
    if (kind === 'game') return '<span class="icon game">▶</span>';
    return '<span class="icon">▬</span>';
  }

  function buildTree(node, container) {
    for (const item of node.children || []) {
      if (item.type === 'dir') {
        const branch = document.createElement('div');
        branch.className = 'tree-branch' + (collapsed.has(item.path) ? ' collapsed' : '');
        branch.dataset.branch = item.path;
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = '<span class="caret"></span><span class="folder-label">' + escapeHtml(item.name) + '</span>';
        row.addEventListener('click', () => {
          branch.classList.toggle('collapsed');
          branch.classList.contains('collapsed') ? collapsed.add(item.path) : collapsed.delete(item.path);
          saveCollapsed();
        });
        const kids = document.createElement('div');
        kids.className = 'tree-children';
        buildTree(item, kids);
        branch.append(row, kids);
        container.appendChild(branch);
      } else {
        const row = document.createElement('div');
        row.className = 'row';
        row.dataset.path = item.path;
        row.innerHTML = fileIcon(item.path, item.icon) + '<span class="label">' + escapeHtml(item.title || item.name) + '</span>';
        row.addEventListener('click', () => navigate(item.path));
        container.appendChild(row);
      }
    }
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  function setActive(path) {
    treeEl.querySelectorAll('.row[data-path]').forEach(r =>
      r.classList.toggle('active', r.dataset.path === path));
  }

  // ===== Breadcrumb =====
  function renderCrumb(path) {
    const parts = path.replace(/\.html$/, '').split('/');
    const last = parts.pop();
    let html = '<span class="crumb-link" data-goto="index.html">home</span>';
    for (const p of parts) html += '<span class="sep">›</span><span class="crumb-muted">' + escapeHtml(p) + '</span>';
    html += '<span class="sep">›</span><span class="crumb-current">' + escapeHtml(titles[path] || last) + '</span>';
    crumbEl.innerHTML = html;
  }
  crumbEl.addEventListener('click', e => {
    const link = e.target.closest('.crumb-link');
    if (link) navigate(link.dataset.goto);
  });

  // ===== Routing: #/<path-without-.html> <-> content pane =====
  function hashToPath() {
    const raw = decodeURIComponent(location.hash.replace(/^#\/?/, '')).replace(/\/+$/, '');
    if (raw === '') return 'index.html';
    return raw + '.html';
  }
  function pathToHash(path) {
    return path === 'index.html' ? '#/index' : '#/' + path.replace(/\.html$/, '');
  }

  let current = null;
  function navigate(path, fromHash) {
    if (!knownPaths.has(path)) path = 'index.html'; // unknown route → home
    if (path === current) return;
    current = path;
    frame.src = GARDEN.contentBase + path;
    document.title = (titles[path] || 'Home') + " — Tairusen's Garden";
    renderCrumb(path);
    setActive(path);
    if (!fromHash && location.hash !== pathToHash(path)) {
      location.hash = pathToHash(path);
    }
  }

  window.addEventListener('hashchange', () => navigate(hashToPath(), true));

  // ===== Explorer visibility (hamburger button / Ctrl+B) =====
  const appEl = document.querySelector('.app');
  const toggleBtn = document.getElementById('explorer-toggle');

  function setExplorerVisible(visible) {
    appEl.classList.toggle('explorer-hidden', !visible);
    localStorage.setItem('garden.explorer.visible', visible ? '1' : '0');
  }
  function toggleExplorer() {
    setExplorerVisible(appEl.classList.contains('explorer-hidden'));
  }
  toggleBtn.addEventListener('click', toggleExplorer);

  // Clicking anywhere outside the explorer closes it. Pane clicks happen in
  // the iframe's document, so they arrive via postMessage from links.js.
  function closeOnOutside(target) {
    if (appEl.classList.contains('explorer-hidden')) return;
    if (target && target.closest &&
        (target.closest('.sidebar') || target.closest('#explorer-toggle') || target.closest('.theme-wrap'))) return;
    setExplorerVisible(false);
  }
  document.addEventListener('click', (e) => closeOnOutside(e.target));
  window.addEventListener('message', (e) => {
    if (e.origin !== location.origin) return;
    if (e.data && e.data.type === 'garden-pane-click') closeOnOutside(null);
  });
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === 'b') {
      e.preventDefault();
      toggleExplorer();
    }
  });
  if (localStorage.getItem('garden.explorer.visible') === '0') {
    appEl.classList.add('explorer-hidden');
  }

  // ===== Theme dropdown =====
  const themeBtn = document.getElementById('theme-btn');
  const themeMenu = document.getElementById('theme-menu');

  function applyTheme(name) {
    if (name) document.documentElement.dataset.theme = name;
    else delete document.documentElement.dataset.theme;
    // Live-sync the open content pane (same-origin, so this is allowed)
    try {
      const fdoc = frame.contentDocument;
      if (fdoc) {
        if (name) fdoc.documentElement.dataset.theme = name;
        else delete fdoc.documentElement.dataset.theme;
      }
    } catch {}
    try { localStorage.setItem('garden.theme', name); } catch {}
    themeMenu.querySelectorAll('button').forEach(b =>
      b.classList.toggle('active', (b.dataset.themeValue || '') === (name || '')));
  }

  themeBtn.addEventListener('click', e => {
    e.stopPropagation();
    themeMenu.classList.toggle('open');
  });
  themeMenu.addEventListener('click', e => {
    const b = e.target.closest('button[data-theme-value]');
    if (!b) return;
    applyTheme(b.dataset.themeValue);
    themeMenu.classList.remove('open');
  });
  document.addEventListener('click', e => {
    if (!themeMenu.contains(e.target) && e.target !== themeBtn) themeMenu.classList.remove('open');
  });
  themeMenu.querySelectorAll('button').forEach(b =>
    b.classList.toggle('active', (b.dataset.themeValue || '') === (localStorage.getItem('garden.theme') || '')));

  // ===== Init =====
  buildTree(GARDEN.tree, treeEl);
  navigate(hashToPath(), true);
</script>
</body>
</html>
